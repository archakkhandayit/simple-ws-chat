<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Share</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
            --chat-bg: #ffffff;
            --sent-bubble: #4f46e5;
            --sent-text: #ffffff;
            --received-bubble: #f1f5f9;
            --received-text: #0f172a;
            --border-color: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .chat-container {
            position: relative;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 680px;
            height: 88vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Responsive Mobile Layout */
        @media (max-width: 640px) {
            body {
                padding: 0;
            }
            .chat-container {
                height: 100vh;
                height: 100dvh;
                max-height: none;
                border-radius: 0;
            }
        }

        /* Header */
        .chat-header {
            padding: 14px 20px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
        }

        .device-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #059669;
            background: #ecfdf5;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .device-badge::before {
            content: '';
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        .clear-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .clear-btn:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        /* Empty State */
        .empty-state {
            margin: auto;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-size: 17px;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 14px;
            max-width: 320px;
            line-height: 1.4;
        }

        /* Message Bubbles */
        .message {
            position: relative;
            max-width: 82%;
            display: flex;
            flex-direction: column;
            animation: popIn 0.25s ease-out;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            align-self: flex-end;
        }

        .message.received {
            align-self: flex-start;
        }

        .message-bubble {
            border-radius: 16px;
            padding: 10px 14px 6px 14px;
            word-break: break-word;
            position: relative;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .message.sent .message-bubble {
            background: var(--sent-bubble);
            color: var(--sent-text);
            border-bottom-right-radius: 4px;
        }

        .message.received .message-bubble {
            background: var(--received-bubble);
            color: var(--received-text);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .message-content {
            font-size: 14.5px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
            user-select: text;
        }

        .message.sent .message-content a {
            color: #bae6fd;
            text-decoration: underline;
            word-break: break-all;
        }

        .message.received .message-content a {
            color: var(--primary);
            text-decoration: underline;
            word-break: break-all;
        }

        /* Message Footer: Timestamp & Copy Icon */
        .message-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 4px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
        }

        /* Clean SVG Copy Icon Button */
        .copy-icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: inherit;
            opacity: 0.6;
            transition: all 0.15s ease;
            line-height: 1;
        }

        .copy-icon-btn:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.08);
            transform: scale(1.08);
        }

        .message.sent .copy-icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .copy-icon-btn:active {
            transform: scale(0.92);
        }

        .copy-icon-btn.copied {
            opacity: 1 !important;
            color: #10b981 !important;
        }

        .message.sent .copy-icon-btn.copied {
            color: #6ee7b7 !important;
        }

        /* Images inside messages */
        .message-image-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #e2e8f0;
            border: 1px solid var(--border-color);
        }

        .message-image {
            display: block;
            max-width: 100%;
            max-height: 320px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .message-image:hover {
            transform: scale(1.02);
        }

        .image-actions {
            padding: 6px 10px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .image-time {
            color: #94a3b8;
            font-size: 11px;
        }

        .action-btn {
            font-size: 11px;
            color: #ffffff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* Typing indicator */
        .typing-indicator {
            padding: 4px 20px;
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
            min-height: 22px;
            background: #f8fafc;
        }

        /* Input Bar */
        .input-container {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 12px 16px;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
        }

        .icon-btn {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: #475569;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .textarea-wrapper {
            flex: 1;
            position: relative;
        }

        .textarea-wrapper textarea {
            width: 100%;
            min-height: 40px;
            max-height: 120px;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.4;
            outline: none;
            resize: none;
            background: #f8fafc;
            color: #0f172a;
            transition: border-color 0.2s, background 0.2s;
        }

        .textarea-wrapper textarea:focus {
            border-color: var(--primary);
            background: #ffffff;
        }

        .send-btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            height: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s, transform 0.1s;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .send-btn:active {
            transform: scale(0.97);
        }

        /* Drag & Drop Overlay */
        .drop-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(79, 70, 229, 0.9);
            color: white;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px dashed #ffffff;
            border-radius: 16px;
            pointer-events: none;
        }

        .drop-overlay.active {
            display: flex;
        }

        .drop-overlay span {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* Image Lightbox Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-actions {
            margin-top: 14px;
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: #ffffff;
            color: #0f172a;
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }

        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: transparent;
            color: white;
            font-size: 28px;
            border: none;
            cursor: pointer;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: #0f172a;
            color: #f8fafc;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 999;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Drag & Drop Overlay -->
        <div class="drop-overlay" id="dropOverlay">
            <span>📷</span>
            <h2>Drop image here to share</h2>
        </div>

        <!-- Chat Header -->
        <div class="chat-header">
            <div class="header-title">
                <h1>⚡ Quick Share</h1>
                <span class="device-badge" id="usersCount">1 device</span>
            </div>
            <button class="clear-btn" id="clearBtn" title="Clear all messages">
                🗑️ Clear
            </button>
        </div>

        <!-- Messages Area -->
        <div class="messages-container" id="messages"></div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator"></div>

        <!-- Input Bar -->
        <div class="input-container">
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            <button class="icon-btn" id="attachBtn" title="Send Image">📎</button>
            <div class="textarea-wrapper">
                <textarea id="messageInput" placeholder="Type message, paste image (Ctrl+V)..." rows="1"></textarea>
            </div>
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>

    <!-- Image Lightbox Modal -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <img id="modalImage" src="" alt="Full view">
            <div class="modal-actions">
                <a id="modalDownload" class="modal-btn" download>⬇ Download Image</a>
            </div>
        </div>
    </div>

    <!-- Floating Toast Feedback -->
    <div class="toast" id="toast">Copied to clipboard!</div>

    <!-- Socket.IO and Client Script -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/script.js"></script>
</body>
</html>
